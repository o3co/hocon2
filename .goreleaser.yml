version: 2
builds:
  - id: hocon2json
    main: ./cmd/hocon2json
    binary: hocon2json
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

  - id: hocon2yaml
    main: ./cmd/hocon2yaml
    binary: hocon2yaml
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

  - id: hocon2toml
    main: ./cmd/hocon2toml
    binary: hocon2toml
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

  - id: hocon2properties
    main: ./cmd/hocon2properties
    binary: hocon2properties
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

  # Reverse conversion: foreign format -> HOCON (v0.7.0).
  - id: json2hocon
    main: ./cmd/json2hocon
    binary: json2hocon
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

  - id: yaml2hocon
    main: ./cmd/yaml2hocon
    binary: yaml2hocon
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

  - id: toml2hocon
    main: ./cmd/toml2hocon
    binary: toml2hocon
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

  - id: properties2hocon
    main: ./cmd/properties2hocon
    binary: properties2hocon
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
